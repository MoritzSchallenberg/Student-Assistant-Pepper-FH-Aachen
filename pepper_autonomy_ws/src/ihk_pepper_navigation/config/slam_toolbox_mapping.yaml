# NICHT GETESTET (slam_toolbox ist auf diesem Entwicklungssystem nicht
# installiert). Install: sudo apt install ros-jazzy-slam-toolbox
#
# WICHTIGE WARNUNG (siehe STATUS.md "Sensor-Bewertung"): Peppers
# eingebauter Laser liefert nur ~1.1Hz bei ~3.9deg Winkelaufloesung und
# 0.1-3.0m Reichweite -- das ist deutlich grober als ein "echtes" Lidar.
# Fuer Mapping WAEHREND DER FAHRT ist das voraussichtlich zu langsam/grob
# (Scans "verwischen" bei Bewegung). Empfehlung: Kartierung im
# Stand/Dreh-Modus durchfuehren (Pepper steht, dreht sich langsam auf der
# Stelle), oder mit RealSense-Tiefendaten fusionieren
# (depthimage_to_laserscan.yaml, image_topic auf die RealSense umstellen).
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /navigation/laser_filtered   # gefiltert, siehe laser_filter_node.py
    mode: mapping

    resolution: 0.05
    max_laser_range: 3.0    # entspricht Peppers Laser-range_max, siehe STATUS.md
    minimum_time_interval: 0.5
    transform_timeout: 0.3
    tf_buffer_duration: 5.0
    stack_size_to_use: 40000000

    # Bewusst konservativ (grobe Sensordaten -> nicht zu oft/schnell neu
    # matchen, sonst driftet die Karte).
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.17
