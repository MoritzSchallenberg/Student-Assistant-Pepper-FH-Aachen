[defaults]
inventory = inventory/production.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
# stdout_callback bewusst NICHT auf "yaml" gesetzt: der yaml-Callback aus
# community.general kollidiert auf manchen Systemen mit neueren
# ansible-core-Versionen (TypeError beim Laden der AnsibleDumper-Klasse,
# gefunden per Live-Test -- siehe docs/GITHUB_DEPLOYMENT_REPORT.md). Der
# eingebaute Standard-Callback braucht keine Zusatz-Collection.
interpreter_python = auto_silent
# Verhindert versehentliches Ausfuehren gegen alle Hosts ohne explizite
# Inventory-Angabe:
inventory_ignore_extensions = .example.yml, .orig, .bak, .cfg, .ini, ~

[ssh_connection]
# StrictHostKeyChecking bleibt beim System-Standard (yes) -- siehe
# Auftrag Abschnitt 6: "StrictHostKeyChecking=no ist nicht zulaessig".
pipelining = True

[privilege_escalation]
become = False
become_method = sudo
