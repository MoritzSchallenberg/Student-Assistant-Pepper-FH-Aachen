---
# Installation: ansible-galaxy collection install -r ansible/requirements.yml
#
# Bewusst leer: `ansible.posix` (synchronize) und `community.general`
# (yaml-Callback) wurden urspruenglich hier deklariert, aber beide
# verursachten auf dem Zielsystem des Nutzers echte Abstuerze durch
# Versionsinkompatibilitaeten mit einem neueren ansible-core (siehe
# GITHUB_DEPLOYMENT_REPORT.md). Beide Faelle wurden durch
# ansible.builtin-Alternativen ersetzt, keine Zusatz-Collection mehr
# noetig. Falls spaeter doch eine Collection gebraucht wird: hier
# eintragen und VORHER lokal testen (ansible-lint + echter Testlauf),
# nicht blind vertrauen.
collections: []
