---
# Versioniertes Deployment (Auftrag Abschnitt 7). Schaltet current NUR
# nach erfolgreichem Build+Test+Healthcheck um.
#
# Nutzung:
#   ansible-playbook -i ansible/inventory/production.yml \
#     ansible/playbooks/deploy.yml -e deploy_revision=<branch-tag-oder-commit>
- name: IHK-Pepper deployen
  hosts: pepper_nuc
  gather_facts: true
  roles:
    - pepper_deploy
    - pepper_services
    # Entwicklungsauftrag 04-B, AP6: ReSpeaker-Konfigurationsvorlage +
    # NUC-Audiopakete. Sichere Defaults (respeaker_transport_kind=mock)
    # -- siehe roles/respeaker_audio/defaults/main.yml.
    - respeaker_audio
