---
pepper_system_user: pepper
pepper_system_group: pepper
pepper_extra_groups:
  - audio
  - video
  - plugdev
  - dialout
pepper_config_dir: /etc/ihk-pepper
pepper_data_dir: /var/lib/ihk-pepper
pepper_log_dir: /var/log/ihk-pepper
pepper_releases_dir: /opt/ihk-pepper

base_apt_packages:
  - git
  - python3
  - python3-pip
  - python3-venv
  - build-essential
  - curl
  - ca-certificates
  - gnupg
  - lsb-release
  - software-properties-common
  - rsync   # noetig fuer pepper_source_method: rsync_from_control_node
