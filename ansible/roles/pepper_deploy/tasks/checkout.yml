---
# Auftrag Abschnitt 6: zwei konfigurierbare Wege, dokumentiert.
# git_deploy_key: NUC zieht per schreibgeschuetztem Deploy-Key von GitHub
#   (siehe docs/github-setup.md fuer die einmalige Einrichtung).
# rsync_from_control_node: Ansible ueberträgt den Quellcode direkt vom
#   Entwicklungsrechner (kein GitHub-Zugriff vom NUC noetig).

- name: Deploy-Key vorhanden? (nur git_deploy_key-Methode)
  when: pepper_source_method == 'git_deploy_key'
  become: true
  become_user: "{{ pepper_system_user }}"
  ansible.builtin.stat:
    path: "{{ pepper_deploy_key_path }}"
  register: pepper_deploy_key_stat

- name: Verstaendliche Fehlermeldung bei fehlendem Deploy-Key
  when:
    - pepper_source_method == 'git_deploy_key'
    - not pepper_deploy_key_stat.stat.exists
  ansible.builtin.fail:
    msg: >-
      Kein Deploy-Key unter {{ pepper_deploy_key_path }} gefunden.
      Einmalige Einrichtung siehe docs/github-setup.md
      ("GitHub Deploy Key fuer den NUC einrichten").

- name: GitHub-Host-Key bekannt? (nur git_deploy_key-Methode)
  when: pepper_source_method == 'git_deploy_key'
  become: true
  become_user: "{{ pepper_system_user }}"
  ansible.builtin.command: ssh-keygen -F github.com -f "/home/{{ pepper_system_user }}/.ssh/known_hosts"
  register: pepper_github_known_hosts
  changed_when: false
  failed_when: false

- name: GitHub-Host-Key sicher eintragen, falls fehlend (kein StrictHostKeyChecking=no, Auftrag Abschnitt 6)
  when:
    - pepper_source_method == 'git_deploy_key'
    - pepper_github_known_hosts.rc != 0
  ansible.builtin.shell: >
    ssh-keyscan -H github.com >> "/home/{{ pepper_system_user }}/.ssh/known_hosts"
  become: true
  become_user: "{{ pepper_system_user }}"
  changed_when: true

- name: Staging-Verzeichnis leeren
  ansible.builtin.file:
    path: "{{ pepper_releases_dir }}/.staging"
    state: absent
  become: true

- name: Quellcode auschecken (Deploy-Key, schreibgeschuetzt)
  when: pepper_source_method == 'git_deploy_key'
  become: true
  become_user: "{{ pepper_system_user }}"
  ansible.builtin.git:
    repo: "{{ pepper_repo_url }}"
    dest: "{{ pepper_releases_dir }}/.staging"
    version: "{{ deploy_revision }}"
    key_file: "{{ pepper_deploy_key_path }}"
    accept_hostkey: false          # Host-Key wird oben explizit/sicher hinterlegt, kein Auto-Accept
    depth: 0                        # voller Klon: deploy_revision kann jeder Branch/Tag/Commit sein

- name: Rsync-Zwischenziel (im Home des Verbindungsbenutzers, ohne become) leeren
  when: pepper_source_method == 'rsync_from_control_node'
  ansible.builtin.file:
    path: "{{ pepper_rsync_tmp_dir }}"
    state: absent

# ansible.posix.synchronize ist auf manchen Systemen mit neuerem
# ansible-core inkompatibel ("'Connection' object has no attribute
# '_new_stdin'", per Live-Test gefunden -- siehe
# GITHUB_DEPLOYMENT_REPORT.md). Ausweichloesung ohne Zusatz-Collection:
# lokal ein tar erstellen, per copy uebertragen, remote entpacken.
- name: Quellcode-Archiv auf dem Kontrollrechner erstellen
  when: pepper_source_method == 'rsync_from_control_node'
  delegate_to: localhost
  become: false
  ansible.builtin.command: >
    tar -czf /tmp/ihk_pepper_release.tar.gz
    --exclude=.git --exclude=build --exclude=install --exclude=log
    --exclude=large_files --exclude=venv --exclude=venv_dialog
    --exclude=__pycache__
    -C {{ pepper_control_node_src_path }} .
  # noqa: command-instead-of-module (kein Modul mit verlaesslichem,
  # rekursivem Exclude-Verhalten wie tar --exclude)
  changed_when: true

- name: Quellcode-Archiv zum NUC uebertragen (in das Home des Verbindungsbenutzers, kein become noetig)
  when: pepper_source_method == 'rsync_from_control_node'
  ansible.builtin.copy:
    src: /tmp/ihk_pepper_release.tar.gz
    dest: "{{ pepper_rsync_tmp_dir }}.tar.gz"
    mode: "0600"

- name: Quellcode-Archiv-Zielverzeichnis anlegen
  when: pepper_source_method == 'rsync_from_control_node'
  ansible.builtin.file:
    path: "{{ pepper_rsync_tmp_dir }}"
    state: directory
    mode: "0700"

- name: Quellcode-Archiv entpacken
  when: pepper_source_method == 'rsync_from_control_node'
  ansible.builtin.unarchive:
    src: "{{ pepper_rsync_tmp_dir }}.tar.gz"
    dest: "{{ pepper_rsync_tmp_dir }}"
    remote_src: true

- name: Uebertragenes Archiv (remote) aufraeumen
  when: pepper_source_method == 'rsync_from_control_node'
  ansible.builtin.file:
    path: "{{ pepper_rsync_tmp_dir }}.tar.gz"
    state: absent

- name: Archiv auf dem Kontrollrechner aufraeumen
  when: pepper_source_method == 'rsync_from_control_node'
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: /tmp/ihk_pepper_release.tar.gz
    state: absent

- name: Rsync-Zwischenziel nach pepper_releases_dir/.staging verschieben
  when: pepper_source_method == 'rsync_from_control_node'
  become: true
  ansible.builtin.command: >
    mv "{{ pepper_rsync_tmp_dir }}" "{{ pepper_releases_dir }}/.staging"
  changed_when: true

- name: Aufgeloeste Revision ermitteln (git_deploy_key-Methode)
  when: pepper_source_method == 'git_deploy_key'
  become: true
  become_user: "{{ pepper_system_user }}"
  ansible.builtin.command: git -C "{{ pepper_releases_dir }}/.staging" rev-parse HEAD  # noqa: command-instead-of-module
  register: pepper_release_id_git
  changed_when: false

- name: Aufgeloeste Revision ermitteln (rsync-Methode, vom Entwicklungsrechner aus)
  when: pepper_source_method == 'rsync_from_control_node'
  delegate_to: localhost
  become: false
  ansible.builtin.command: git -C "{{ pepper_control_node_src_path }}" rev-parse HEAD  # noqa: command-instead-of-module
  register: pepper_release_id_rsync
  changed_when: false
  failed_when: false

- name: release_id festlegen
  ansible.builtin.set_fact:
    release_id: >-
      {{ (pepper_release_id_git.stdout | default(''))
         or (pepper_release_id_rsync.stdout | default(''))
         or ('local-' + ansible_date_time.iso8601_basic_short) }}

- name: Pruefen ob dieser Release bereits existiert (Idempotenz)
  become: true
  ansible.builtin.stat:
    path: "{{ pepper_releases_dir }}/releases/{{ release_id }}"
  register: pepper_release_exists

- name: Staging in Release-Verzeichnis verschieben
  when: not pepper_release_exists.stat.exists
  become: true
  ansible.builtin.command: >
    mv "{{ pepper_releases_dir }}/.staging" "{{ pepper_releases_dir }}/releases/{{ release_id }}"
  changed_when: true

- name: Staging aufraeumen, falls Release bereits existierte
  when: pepper_release_exists.stat.exists
  ansible.builtin.file:
    path: "{{ pepper_releases_dir }}/.staging"
    state: absent
  become: true

- name: Besitzrechte des Release-Verzeichnisses setzen
  become: true
  ansible.builtin.file:
    path: "{{ pepper_releases_dir }}/releases/{{ release_id }}"
    owner: "{{ pepper_system_user }}"
    group: "{{ pepper_system_group }}"
    recurse: true
    state: directory
