# NICHT GETESTET (Nav2 ist auf diesem Entwicklungssystem nicht
# installiert, siehe package.xml/docs/IMPLEMENTATION_REPORT.md).
# Install: sudo apt install ros-jazzy-navigation2 ros-jazzy-nav2-bringup
#
# Produktions-/Lokalisierungs-Stack (Moeglichkeit B, Auftrag Abschnitt 6):
# AMCL auf einer vorher mit slam_toolbox erstellten Karte + Planner +
# Controller + Behavior Server + BT Navigator + Waypoint Follower +
# Velocity Smoother + Collision Monitor + Twist Mux.
# Befehlskette: Nav2 -> Velocity Smoother -> Collision Monitor ->
# Twist Mux -> /cmd_vel -> naoqi_driver2 -> Pepper (siehe nav2_bringup.launch.py).
#
# FUSSABDRUCK (footprint): 0.30m Kreisradius ist ein KONSERVATIVER
# PLATZHALTER (Pepper-Basis ist laut Hersteller-Datenblatt ca. 0.48m im
# Durchmesser = 0.24m Radius) -- absichtlich groesser gewaehlt, MUSS aber
# vor echtem Einsatz gegen das reale URDF (ros2/robot_model/) und den
# echten Roboter verifiziert werden. Angehobene Arme sind hierin NICHT
# beruecksichtigt -- waehrend Fahrt duerfen keine Arm-Gesten laufen (siehe
# SafetyGate/Supervisor-Arbitrierung).

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /navigation/laser_filtered
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.2
    update_min_a: 0.2
    set_initial_pose: false   # MUSS ueber RViz/Service manuell gesetzt werden -- kein Blindstart

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3      # bewusst langsam, siehe max_speed weiter unten
      max_angular_accel: 1.5
      min_approach_linear_velocity: 0.05
      use_regulated_linear_velocity_scaling: true
      use_collision_detection: true

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: ["spin", "backup", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    # Rueckwaertsfahren bewusst konservativ (Auftrag: "vorsichtige
    # Konfiguration fuer Rueckwaertsbewegungen")
    min_backup_speed: -0.05
    max_backup_speed: -0.1

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 0.6]     # [vx, vy, wz] -- vy=0: Pepper-Basis ist NICHT holonom im normalen Fahrmodus
    min_velocity: [-0.1, 0.0, -0.6]
    max_accel: [0.4, 0.0, 1.5]
    max_decel: [-0.4, 0.0, -1.5]
    odom_topic: /odom

# Collision Monitor: letzte Sicherheitsinstanz VOR dem Twist Mux/der
# Hardware. holonomic=false weil velocity_smoother oben vy=0 erzwingt
# (Pepper faehrt normalerweise nicht seitwaerts) -- falls spaeter
# Seitwaertsbewegung genutzt wird, MUSS holonomic hier auf true UND
# max_velocity[1] oben ungleich 0 gesetzt werden (Auftrag-Vorgabe).
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_raw
    cmd_vel_out_topic: cmd_vel_smoothed
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    holonomic: false
    stop_pub_timeout: 2.0

    polygons: ["StopZone", "SlowZone", "BumperStop"]

    StopZone:
      type: "polygon"
      points: [0.35, 0.25, 0.35, -0.25, -0.1, -0.25, -0.1, 0.25]
      action_type: "stop"
      min_points: 3

    SlowZone:
      type: "polygon"
      points: [0.55, 0.35, 0.55, -0.35, -0.2, -0.35, -0.2, 0.35]
      action_type: "slowdown"
      slowdown_ratio: 0.4
      min_points: 3

    # Physischer Bumper -> sofortiger Stopp, unabhaengig vom Laser/der
    # Tiefenkamera (letzte, hardware-nahe Instanz).
    BumperStop:
      type: "polygon"
      points: [0.3, 0.3, 0.3, -0.3, -0.3, -0.3, -0.3, 0.3]
      action_type: "stop"
      min_points: 1
      source_timeout: 5.0

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /navigation/laser_filtered

# Twist Mux: einzige Stelle, an der /cmd_vel tatsaechlich an naoqi_driver2
# geht -- priorisiert Not-Halt/manuelle Teleop hoeher als Nav2-Kommandos.
twist_mux:
  ros__parameters:
    use_sim_time: false
    topics:
      navigation:
        topic: cmd_vel_smoothed
        timeout: 0.5
        priority: 10
      teleop:
        topic: cmd_vel_teleop
        timeout: 0.5
        priority: 50
      estop:
        topic: cmd_vel_estop
        timeout: 0.5
        priority: 100
    locks:
      emergency_stop:
        # twist_mux erwartet hier std_msgs/Bool, NICHT direkt unsere
        # SafetyState-Message -- es fehlt noch ein kleiner Bruecken-Node,
        # der /safety_state.emergency_stop auf ein Bool-Topic spiegelt
        # (NICHT Teil dieser Session, siehe docs/IMPLEMENTATION_REPORT.md).
        topic: /safety_state_emergency_stop_bool
        timeout: 1.0
        priority: 255
