# NICHT GETESTET (voller Nav2-Stack ist auf diesem Entwicklungssystem
# nicht installiert, siehe docs/DEVELOPMENT_ORDER_02_REPORT.md AP1 fuer
# die exakten Install-Befehle). Ueberarbeitet in Entwicklungsauftrag 2,
# AP6 (Costmap) + AP7 (holonome Fahrregelung, cmd_vel-Verdrahtung).
#
# REALSENSE-ONLY (Auftrag 2, Abschnitt 1): map->odom kommt aus
# realsense_localization.launch.py, odom->base_link aus
# realsense_odometry.launch.py (beide RTAB-Map, AP4/AP5) -- NICHT aus
# AMCL/robot_localization mit Pepper-Odometrie/-IMU. Diese Datei
# konfiguriert nur noch die VERBRAUCHENDEN Nav2-Nodes (Controller,
# Planner, Behavior Server, BT Navigator, Waypoint Follower, Velocity
# Smoother, Collision Monitor, Motion Guard, Twist Mux) -- kein amcl,
# kein map_server, kein robot_localization mehr in nav2_bringup.launch.py
# (siehe dortige Aenderungshistorie).
#
# Befehlskette (repariert, AP7 -- siehe docs/DEVELOPMENT_ORDER_02_REPORT.md
# fuer die vier urspruenglich gefundenen Verdrahtungsfehler):
#   Nav2 controller_server -> cmd_vel_raw -> Velocity Smoother ->
#   cmd_vel_smoothed_raw -> Collision Monitor -> cmd_vel_smoothed ->
#   Motion Guard (AP8, motion_guard/cmd_vel_in) -> /cmd_vel ->
#   naoqi_driver2 -> Pepper. Twist Mux entfaellt als eigene Instanz vor
#   /cmd_vel -- Motion Guard uebernimmt dessen Rolle als letzte Instanz
#   UND prueft zusaetzlich alle Auftrag-2-Sicherheitssignale (AP8).
#
# FUSSABDRUCK (footprint): 0.30m Kreisradius, hergeleitet aus Peppers
# Hersteller-Datenblatt (Basisdurchmesser ca. 0.48m = 0.24m Radius) PLUS
# Sicherheitszuschlag -- NICHT aus den URDF-Kollisionsgeometrien
# programmatisch abgeleitet (ros2/robot_model/.../pepper.urdf nutzt
# Mesh-Kollisionsgeometrie ohne einfache Radius-Primitive, ein
# automatischer Abgleich war damit nicht moeglich). Vor echtem Einsatz
# gegen den realen Roboter verifizieren. Angehobene Arme sind hierin
# NICHT beruecksichtigt -- waehrend Fahrt duerfen keine Arm-Gesten laufen
# (SafetyGate/Supervisor-Arbitrierung, gesture_catalog.py nav2_moving).

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3      # bewusst langsam, siehe max_speed weiter unten
      max_angular_accel: 1.5
      min_approach_linear_velocity: 0.05
      use_regulated_linear_velocity_scaling: true
      use_collision_detection: true

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true

# Costmaps (Entwicklungsauftrag 2, AP6 -- vorher komplett gefehlt, Nav2
# hatte damit gar keine Hinderniskarte). Hindernisquelle: das bereits
# konfigurierte depthimage_to_laserscan (config/depthimage_to_laserscan.yaml,
# depth_to_laserscan.launch.py aus Auftrag 1), auf die RealSense-Tiefe
# umgestellt (Launch-Argument image_topic/camera_info_topic) statt
# Pepper-eigene Tiefe -- publiziert auf /navigation/depth_scan.
# Begruendung fuer scan statt PointCloud2: Nav2s obstacle_layer/scan-Pfad
# ist der am besten getestete/dokumentierte Weg, braucht kein zusaetzliches
# Aktivieren von realsense2_camera's pointcloud.enable (aktuell bewusst
# aus, siehe realsense_bringup.launch.py) und keine zusaetzliche
# Bandbreite. NACHTEIL, ehrlich dokumentiert (siehe
# docs/REALSENSE_NAVIGATION_ARCHITECTURE.md, Abdeckungsnachweis AP6):
# ein depthimage_to_laserscan-Scan ist nur EINE horizontale Ebene aus dem
# Sichtfeld EINER kopfmontierten Kamera -- keine Abdeckung seitlich/
# hinter Pepper, kein Nahbereich unterhalb des Kamerasichtfelds. Diese
# Luecke wird NICHT schoengeredet: Livebewegung bleibt gesperrt (Motion
# Guard, AP8), bis eine zusaetzliche Nahbereichs-/Rundum-Absicherung
# nachgewiesen ist. Der Collision-Monitor-BumperStop bleibt als
# unabhaengige, RealSense-lose letzte Instanz bestehen.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Siehe Datei-Kopfkommentar: Herstellerangabe + Sicherheitszuschlag,
      # nicht aus dem URDF programmatisch abgeleitet.
      footprint: "[[0.30, 0.30], [0.30, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "realsense_scan"
        realsense_scan:
          topic: /navigation/depth_scan
          data_type: "LaserScan"
          # Nahbereich/tote Winkel (Auftrag Abschnitt 9): RealSense-D4xx
          # hat eine physikalische Mindestmessdistanz -- alles darunter
          # ist ein blinder Nahbereich, NICHT als frei interpretieren.
          min_obstacle_height: -0.5
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Zusaetzlich zum Fussabdruck-Zuschlag oben -- puffert Restrisiko
        # der unten dokumentierten Abdeckungsluecke ab (ersetzt sie NICHT).
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[0.30, 0.30], [0.30, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
      # Statische Karte kommt aus RTAB-Map-Lokalisierung (AP5) -- kein
      # eigener static_layer/map_server-Bezug mehr hier (kein map_server
      # in nav2_bringup.launch.py, siehe Datei-Kopfkommentar).
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "realsense_scan"
        realsense_scan:
          topic: /navigation/depth_scan
          data_type: "LaserScan"
          min_obstacle_height: -0.5
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.4

behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: ["spin", "backup", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    # Rueckwaertsfahren bewusst konservativ (Auftrag: "vorsichtige
    # Konfiguration fuer Rueckwaertsbewegungen")
    min_backup_speed: -0.05
    max_backup_speed: -0.1

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    # AP7: RealSense-only -- NICHT mehr Peppers eigenes /odom, sondern
    # RTAB-Map-Odometrie (AP4, realsense_odometry.launch.py).
    odom_topic: /realsense/odom

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # AP7: Pepper besitzt eine echte omnidirektionale (3-Rad-)Basis, und
    # naoqi_driver2s TeleopSubscriber::cmd_vel_callback (large_files/ros2_ws/
    # src/naoqi_driver2/src/subscribers/teleop.cpp:51-60) reicht linear.y
    # unveraendert an ALMotion.move(x,y,theta) durch -- per Quellcode-Review
    # bestaetigt (siehe docs/DEVELOPMENT_ORDER_02_REPORT.md AP1), NICHT live
    # an Hardware getestet. vy daher jetzt freigegeben, aber bewusst sehr
    # konservativ begrenzt (deutlich kleiner als vx) fuer den ersten echten
    # Test. Falls der erste Test zeigt, dass NAOqi anders reagiert als der
    # Quelltext vermuten laesst: hier vy sofort zurueck auf 0 setzen (siehe
    # Kommentar-Historie dieser Datei, vorheriger Wert war vy=0).
    max_velocity: [0.35, 0.1, 0.6]     # [vx, vy, wz]
    min_velocity: [-0.1, -0.1, -0.6]
    max_accel: [0.4, 0.2, 1.5]
    max_decel: [-0.4, -0.2, -1.5]
    odom_topic: /realsense/odom   # AP7: RealSense-only, nicht mehr Peppers /odom
  # AP7-Verdrahtungsfix: liest jetzt tatsaechlich das, was controller_server
  # publiziert (siehe nav2_bringup.launch.py-Remapping "cmd_vel"->"cmd_vel_raw"
  # jetzt auch am controller_server, nicht nur hier).

# Collision Monitor: letzte Nav2-interne Sicherheitsinstanz VOR Motion
# Guard (AP8)/der Hardware. holonomic=true (AP7, siehe Begruendung oben
# bei velocity_smoother) -- Collision Monitor beruecksichtigt damit auch
# seitliche Bewegung bei der Stop-/Slow-Zonen-Pruefung.
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    # AP7-Verdrahtungsfix: liest jetzt tatsaechlich velocity_smoothers
    # Ausgabe (vorher: beide lasen/schrieben dieselben Topics, siehe
    # docs/DEVELOPMENT_ORDER_02_REPORT.md AP1 fuer die vier gefundenen
    # Fehler). cmd_vel_smoothed_raw -> cmd_vel_smoothed haengt jetzt
    # wirklich HINTER dem velocity_smoother, nicht parallel dazu.
    cmd_vel_in_topic: cmd_vel_smoothed_raw
    cmd_vel_out_topic: cmd_vel_smoothed
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    holonomic: true
    stop_pub_timeout: 2.0

    polygons: ["StopZone", "SlowZone", "BumperStop"]

    StopZone:
      type: "polygon"
      points: [0.35, 0.25, 0.35, -0.25, -0.1, -0.25, -0.1, 0.25]
      action_type: "stop"
      min_points: 3

    SlowZone:
      type: "polygon"
      points: [0.55, 0.35, 0.55, -0.35, -0.2, -0.35, -0.2, 0.35]
      action_type: "slowdown"
      slowdown_ratio: 0.4
      min_points: 3

    # Physischer Bumper -> sofortiger Stopp, unabhaengig vom Laser/der
    # Tiefenkamera (letzte, hardware-nahe Instanz).
    BumperStop:
      type: "polygon"
      points: [0.3, 0.3, 0.3, -0.3, -0.3, -0.3, -0.3, 0.3]
      action_type: "stop"
      min_points: 1
      source_timeout: 5.0

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /navigation/laser_filtered

# Twist Mux ENTFAELLT als eigene Instanz (Entwicklungsauftrag 2, AP7/AP8):
# Motion Guard (ihk_pepper_interaction/motion_guard_node.py) uebernimmt
# dessen Rolle als letzte Instanz vor /cmd_vel UND prueft zusaetzlich
# Bumper/Not-Halt/RealSense-Diagnose/Odometrie/Lokalisierung/Hindernisse/
# Kopfpose/Gestenablauf/Befehlsalter -- siehe motion_guard.py. Kein
# separates Bool-Bruecken-Topic mehr noetig (Motion Guard liest
# SafetyState.emergency_stop direkt aus /safety_state).
