# NICHT GETESTET (depthimage_to_laserscan ist auf diesem Entwicklungssystem
# nicht installiert, siehe package.xml/docs/IMPLEMENTATION_REPORT.md).
# Install: sudo apt install ros-jazzy-depthimage-to-laserscan
#
# Wandelt ein Tiefenbild (Pepper-Tiefenkamera ODER optional eine
# RealSense, siehe image_topic weiter unten) in einen LaserScan um, damit
# Nav2s Costmap eine zweite, dichtere Hinderniserkennung neben dem
# eingebauten /laser (siehe laser_filter_node.py) bekommt.
depthimage_to_laserscan:
  ros__parameters:
    scan_height: 10          # Anzahl Pixelzeilen um die Bildmitte, die gemittelt werden
    scan_time: 0.033
    range_min: 0.35           # Pepper-Tiefenkamera Mindestreichweite (Herstellerangabe, ungeprueft)
    range_max: 5.0
    output_frame: camera_depth_frame
