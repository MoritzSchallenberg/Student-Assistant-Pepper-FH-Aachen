# NICHT GETESTET (robot_localization ist auf diesem Entwicklungssystem
# nicht installiert). Install: sudo apt install ros-jazzy-robot-localization
#
# NICHT MEHR TEIL DES REALSENSE-ONLY-NAVIGATIONSPFADS (Entwicklungsauftrag
# 2, Abschnitt 1: "duerfen keine Odometrie-... Daten von Pepper
# verwenden"). odom->base_link kommt seit Auftrag 2 stattdessen aus
# RTAB-Map RGB-D Visual Odometry (realsense_odometry.launch.py, AP4).
# Diese Datei bleibt bewusst erhalten (nicht geloescht) -- falls ein
# spaeterer, ausdruecklich NICHT-RealSense-only-Modus (z.B. reiner
# Pepper-Kopfkamera-Fallback ohne RTAB-Map) sie einmal braucht -- wird
# aber von KEINEM aktuellen Launch-File mehr eingebunden
# (nav2_bringup.launch.py startet seit Auftrag 2 keinen ekf_filter_node
# mehr).
#
# Ehemalige Beschreibung (Auftrag 1, nur noch als Referenz): EKF fuer
# eine stabile odom->base_link Transformation aus Peppers eigener
# Odometrie (naoqi_driver2, Topic /odom) + IMU (/imu/base).
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom          # dieser EKF liefert odom->base_link, NICHT map->odom (das macht AMCL)

    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    imu0: /imu/base
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

    # Optional: zweite IMU einer RealSense-Kamera, falls verbaut (Abschnitt
    # 6 verlangt "moeglichst mit einer RealSense" als Option) -- deaktiviert
    # per Default, siehe robot_localization_with_realsense.yaml.Beispiel unten.
    # imu1: /camera/imu
    # imu1_config: [false, false, false, true, true, true, false, false, false, true, true, true, true, true, true]
