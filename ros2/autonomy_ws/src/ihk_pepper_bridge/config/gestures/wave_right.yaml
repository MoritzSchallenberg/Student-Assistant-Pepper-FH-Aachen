name: wave_right
description: "Winkt mit dem rechten Arm (3x)"
metadata:
  imported_from: "apps/web/pepper/qicli.py wave(side='R')"
disable_breathing: []
restore_after: true
steps:
  - {joint: RShoulderPitch, angle: -1.0, duration: 1.0}
  - {joint: RElbowRoll, angle: 0.9, duration: 1.0}
  - {joint: RElbowYaw, angle: 0.6, duration: 0.4}
  - {joint: RElbowYaw, angle: 1.6, duration: 0.4}
  - {joint: RElbowYaw, angle: 0.6, duration: 0.4}
  - {joint: RElbowYaw, angle: 1.6, duration: 0.4}
  - {joint: RElbowYaw, angle: 0.6, duration: 0.4}
  - {joint: RElbowYaw, angle: 1.6, duration: 0.4}
