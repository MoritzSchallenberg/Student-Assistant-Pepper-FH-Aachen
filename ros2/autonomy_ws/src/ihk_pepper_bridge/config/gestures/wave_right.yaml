schema_version: 2
name: wave_right
description: >
  Winkt mit dem rechten Arm -- ein freundlicher Gruss.
system_only: false
selectable_by_llm: true
semantic_tags: [greeting, waving, farewell]
requires_stationary: true
allowed_interaction_states: [IDLE, ATTRACT, CONVERSATION_READY]
speed_scale_default: 1.0
restore_after: true
tested_status: dry_run_validated
tested_date: "2026-09-03"
test_note: >
  Aus der vorher live getesteten sequenziellen v1-Version
  (RShoulderPitch=-1.0, RElbowRoll=0.9, RElbowYaw 0.6<->1.6
  oszillierend, siehe docs/STATUS.md/docs/CAPABILITIES.md) in synchrone
  Keyframes uebersetzt -- dieselben Winkelwerte, jetzt als EIN
  synchroner ALMotion-Aufruf statt 8 sequenzieller qicli-Einzelaufrufe.
  Winkelwerte identisch zur live getesteten v1-Sequenz (dieselbe Person,
  dieselbe Session urspruenglich getestet). Der NEUE synchrone
  v2-Transportweg selbst (play_trajectory/qicli-JSON-Argumente) ist
  dry_run_validated, NICHT live_validated -- kein Pepper-Zugriff in
  dieser Session. Vor produktivem Einsatz einzeln unter Aufsicht pruefen.
max_duration_s: 3.5
on_cancel: restore
keyframes:
  - time_from_start_s: 0.8
    joints: {RShoulderPitch: -1.0, RElbowRoll: 0.9, RElbowYaw: 0.6}
  - time_from_start_s: 1.2
    joints: {RElbowYaw: 1.6}
  - time_from_start_s: 1.6
    joints: {RElbowYaw: 0.6}
  - time_from_start_s: 2.0
    joints: {RElbowYaw: 1.6}
  - time_from_start_s: 2.4
    joints: {RElbowYaw: 0.6}
  - time_from_start_s: 2.8
    joints: {RElbowYaw: 1.6}
