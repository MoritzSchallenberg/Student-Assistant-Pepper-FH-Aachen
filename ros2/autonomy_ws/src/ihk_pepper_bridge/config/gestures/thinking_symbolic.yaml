schema_version: 2
name: thinking_symbolic
description: >
  Symbolisches Nachdenken -- Kopf neigt sich leicht zur Seite, rechter
  Arm hebt sich Richtung Brust (NICHT Richtung Gesicht/Kinn).
system_only: false
selectable_by_llm: true
semantic_tags: [thinking, pondering, symbolic_gesture]
requires_stationary: true
allowed_interaction_states: [CONVERSATION_READY]
speed_scale_default: 0.5
restore_after: true
tested_status: draft
tested_date: null
test_note: >
  Neue Kombinationsgeste (Kopf+Arm) ohne Live-Referenz -- bewusst auf
  draft belassen, RShoulderPitch/RElbowRoll so gewaehlt, dass die Hand
  rechnerisch weit unterhalb der Kopfhoehe bleibt (keine echte
  Vorwaertskinematik in dieser Session verfuegbar, daher zusaetzlich
  konservativ). Bewegungsregel "keine Haende in den Gesichtsbereich"
  wird STRIKT eingehalten: RShoulderPitch bleibt bei 0.7 (positiver Wert
  = Arm bleibt TIEF, siehe wave_right.yaml/open_arms.yaml, wo negative
  Werte den Arm anheben) -- die Hand bleibt dadurch auf Brusthoehe,
  kommt dem Kopf nicht nahe.
  AP8.4-Migration (Entwicklungsauftrag 04-B, bestaetigter Fund 3.4): der
  urspruengliche erste Keyframe (t=0.0, HeadYaw=0.15, HeadPitch=-0.1)
  wich von der angenommenen NEUTRAL_STAND_POSE-Startpose (beide 0.0) ab,
  was der neue Uebergangs-/Geschwindigkeitscheck aus AP8.4 korrekt als
  Sprung ablehnt (Minimum 0.05s bei 0.15rad/3.0rad/s). Migration OHNE
  Bedeutungsaenderung: neuer Haltepunkt bei t=0.0 (HeadYaw=0.0,
  HeadPitch=0.0) eingefuegt, urspruenglicher erster Keyframe auf t=0.2s
  verschoben (Marge). Alle weiteren Keyframe-Zeiten (t=1.2) unveraendert
  -- Gesamtdauer/Choreografie identisch.
max_duration_s: 2.5
on_cancel: restore
keyframes:
  - time_from_start_s: 0.0
    joints: {HeadYaw: 0.0, HeadPitch: 0.0}
  - time_from_start_s: 0.2
    joints: {HeadYaw: 0.15, HeadPitch: -0.1}
  - time_from_start_s: 1.2
    joints: {RShoulderPitch: 0.7, RShoulderRoll: -0.2, RElbowRoll: 0.9, RElbowYaw: 0.3}
