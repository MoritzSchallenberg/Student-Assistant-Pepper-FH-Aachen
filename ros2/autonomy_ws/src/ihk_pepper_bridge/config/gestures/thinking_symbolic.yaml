schema_version: 2
name: thinking_symbolic
description: >
  Entwicklungsauftrag 3, AP13: symbolisches "Nachdenken" -- Kopf neigt
  sich leicht zur Seite/nach oben, rechter Arm hebt sich Richtung Brust
  (NICHT Richtung Gesicht/Kinn). Bewegungsregel "keine Haende in den
  Gesichtsbereich" wird STRIKT eingehalten: RShoulderPitch bleibt bei
  0.7 (positiver Wert = Arm bleibt TIEF, siehe wave_right.yaml/
  open_arms.yaml, wo negative Werte den Arm anheben) -- die Hand
  bleibt dadurch auf Brusthoehe, kommt dem Kopf nicht nahe. Bewusst
  konservativer als eine "Hand-am-Kinn"-Geste, die dieser Auftrag
  explizit ausschliesst.
requires_stationary: true
allowed_interaction_states: [CONVERSATION_READY]
speed_scale_default: 0.5
restore_after: true
tested_status: draft
tested_date: null
test_note: >
  Neue Kombinationsgeste (Kopf+Arm) ohne Live-Referenz -- bewusst auf
  draft belassen, RShoulderPitch/RElbowRoll so gewaehlt, dass die Hand
  rechnerisch weit unterhalb der Kopfhoehe bleibt (keine echte
  Vorwaertskinematik in dieser Session verfuegbar, daher zusaetzlich
  konservativ).
max_duration_s: 2.5
on_cancel: restore
keyframes:
  - time_from_start_s: 0.0
    joints: {HeadYaw: 0.15, HeadPitch: -0.1}
  - time_from_start_s: 1.2
    joints: {RShoulderPitch: 0.7, RShoulderRoll: -0.2, RElbowRoll: 0.9, RElbowYaw: 0.3}
