schema_version: 2
name: explain_right
description: >
  Erklaer-Geste mit Verweis auf Peppers rechte Seite -- Spiegelbild von
  explain_left.yaml (rechter statt linker Arm, gespiegelte Vorzeichen).
system_only: false
selectable_by_llm: true
semantic_tags: [explanation, gesture_right, reference_pointing]
requires_stationary: true
allowed_interaction_states: [CONVERSATION_READY]
speed_scale_default: 0.7
restore_after: true
tested_status: draft
tested_date: null
test_note: >
  Spiegelung von explain_left.yaml -- gleiche Herleitung/Begruendung.
max_duration_s: 2.0
on_cancel: restore
keyframes:
  - time_from_start_s: 0.7
    joints: {RShoulderPitch: 0.0, RShoulderRoll: -0.6, RElbowRoll: 0.1}
  - time_from_start_s: 1.4
    joints: {RShoulderPitch: 0.15, RShoulderRoll: -0.3, RElbowRoll: 0.05}
