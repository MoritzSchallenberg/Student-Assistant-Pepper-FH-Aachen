schema_version: 2
name: self_hug_symbolic
description: >
  Kontaktlose, SYMBOLISCHE Eigenbewegung -- Arme leicht Richtung eigenen
  Oberkoerper. Pepper darf hierbei KEINE Person beruehren und KEINE
  echte Umarmung ausfuehren (Entwicklungsauftrag 1, Abschnitt 7,
  explizit ausgeschlossen). Keine vergleichbare bisher getestete Geste
  vorhanden -- Winkel deshalb bewusst klein/konservativ gewaehlt.
requires_stationary: true
allowed_interaction_states: [CONVERSATION_READY]
speed_scale_default: 0.5
restore_after: true
tested_status: draft
tested_date: null
test_note: >
  Keine Live-Referenzgeste vorhanden -- Winkel bewusst konservativ
  gewaehlt, noch nicht einmal dry_run visuell an einem echten Pepper
  geprueft. Vor jeder Live-Nutzung besonders sorgfaeltig einzeln,
  langsam und unter direkter Aufsicht pruefen.
  AP8.4-Korrektur (Entwicklungsauftrag 04-B): max_duration_s bezog sich
  bislang auf die unskalierte time_from_start_s-Achse. Der Compiler
  prueft seit AP8.4 die tatsaechlich AUSGEFUEHRTE Dauer nach
  speed_scale_default-Skalierung (2.0s / 0.5 = 4.0s). max_duration_s
  wurde entsprechend auf den real ausgefuehrten Wert (+Marge) korrigiert
  -- keine Aenderung an Keyframes/Winkeln/Bewegung.
max_duration_s: 4.1
on_cancel: restore
keyframes:
  - time_from_start_s: 2.0
    joints: {LShoulderPitch: 0.5, RShoulderPitch: 0.5, LElbowRoll: -0.6, RElbowRoll: 0.6}
