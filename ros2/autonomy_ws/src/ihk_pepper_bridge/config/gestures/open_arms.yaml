schema_version: 2
name: open_arms
description: >
  Arme einladend zur Seite oeffnen, etwas zurueckhaltender als die volle
  T-Pose. ShoulderRoll-Zielwinkel (0.9 statt der live getesteten 1.3 aus
  t_pose.yaml) bewusst konservativer als der bewiesene t_pose-Wert
  gewaehlt, ShoulderPitch=0.0 identisch zu t_pose.yaml uebernommen.
requires_stationary: true
allowed_interaction_states: [IDLE, ATTRACT, CONVERSATION_READY]
speed_scale_default: 0.6
restore_after: true
tested_status: dry_run_validated
tested_date: "2026-09-03"
test_note: >
  ShoulderPitch von der live getesteten t_pose-Sequenz uebernommen,
  ShoulderRoll bewusst unterhalb des dort getesteten Werts. Der
  v2-Transport selbst ist NICHT live geprueft.
max_duration_s: 3.0
on_cancel: restore
keyframes:
  - time_from_start_s: 2.0
    joints: {LShoulderPitch: 0.0, RShoulderPitch: 0.0, LShoulderRoll: 0.9, RShoulderRoll: -0.9}
