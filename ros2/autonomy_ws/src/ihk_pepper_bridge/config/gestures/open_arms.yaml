schema_version: 2
name: open_arms
description: >
  Arme einladend zur Seite oeffnen -- etwas zurueckhaltender als die
  volle T-Pose.
system_only: false
selectable_by_llm: true
semantic_tags: [welcoming, open_gesture, invitation]
requires_stationary: true
allowed_interaction_states: [IDLE, ATTRACT, CONVERSATION_READY]
speed_scale_default: 0.6
restore_after: true
tested_status: dry_run_validated
tested_date: "2026-09-03"
test_note: >
  ShoulderPitch von der live getesteten t_pose-Sequenz uebernommen,
  ShoulderRoll bewusst unterhalb des dort getesteten Werts (0.9 statt
  1.3). Der v2-Transport selbst ist NICHT live geprueft.
  AP8.4-Korrektur (Entwicklungsauftrag 04-B): max_duration_s bezog sich
  bislang auf die unskalierte time_from_start_s-Achse. Der Compiler
  prueft seit AP8.4 die tatsaechlich AUSGEFUEHRTE Dauer nach
  speed_scale_default-Skalierung (2.0s / 0.6 = 3.33s). max_duration_s
  wurde entsprechend auf den real ausgefuehrten Wert (+Marge) korrigiert
  -- keine Aenderung an Keyframes/Winkeln/Bewegung, der bereits
  durchgefuehrte dry-run bleibt inhaltlich gueltig.
max_duration_s: 3.4
on_cancel: restore
keyframes:
  - time_from_start_s: 2.0
    joints: {LShoulderPitch: 0.0, RShoulderPitch: 0.0, LShoulderRoll: 0.9, RShoulderRoll: -0.9}
