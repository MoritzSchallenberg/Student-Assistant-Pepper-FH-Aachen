schema_version: 2
name: disagree_head
description: >
  Leichtes Kopfschuetteln -- signalisiert Verneinung oder Unsicherheit.
system_only: false
selectable_by_llm: true
semantic_tags: [disagreement, negation, uncertainty]
requires_stationary: true
allowed_interaction_states: [CONVERSATION_READY]
speed_scale_default: 0.8
restore_after: true
tested_status: draft
tested_date: null
test_note: >
  Keine Live-Referenz fuer Kopfgesten vorhanden -- konservative
  Amplitude/Geschwindigkeit (1.5 rad/s Spitzenwert, unter der
  wave_right-Referenz von 2.5 rad/s). HeadYaw oszilliert zwischen -0.3
  und 0.3 rad -- deutlich konservativer als die dokumentierte
  HeadYaw-Grenze (+-2.0857).
max_duration_s: 2.0
on_cancel: restore
keyframes:
  - time_from_start_s: 0.4
    joints: {HeadYaw: -0.3}
  - time_from_start_s: 0.8
    joints: {HeadYaw: 0.3}
  - time_from_start_s: 1.2
    joints: {HeadYaw: -0.3}
  - time_from_start_s: 1.6
    joints: {HeadYaw: 0.0}
