schema_version: 2
name: neutral_stand
description: >
  Interne, neutrale Referenz-/Reset-Haltung fuer Kopf, Arme und Huefte
  -- entspricht der NEUTRAL_STAND_POSE-Konstante in kinematic_compiler.py.
  Systemgeste ohne nachgewiesenen nutzergerichteten Einsatzpfad, deshalb
  nicht vom LLM auswaehlbar.
system_only: true
selectable_by_llm: false
semantic_tags: []
requires_stationary: true
allowed_interaction_states: []
speed_scale_default: 0.5
restore_after: false
tested_status: dry_run_validated
tested_date: "2026-09-04"
test_note: >
  Reine Neutralstellung, alle Winkel weit innerhalb der dokumentierten
  (teils nicht live verifizierten) Gelenkgrenzen aus joint_limits.py.
  Der v2-Transport selbst ist dry_run_validated, NICHT live_validated.
  AP8.4-Korrektur (Entwicklungsauftrag 04-B): max_duration_s bezog sich
  bislang auf die unskalierte time_from_start_s-Achse. Der Compiler
  prueft seit AP8.4 die tatsaechlich AUSGEFUEHRTE Dauer nach
  speed_scale_default-Skalierung (1.5s / 0.5 = 3.0s). max_duration_s
  wurde entsprechend auf den real ausgefuehrten Wert (+Marge) korrigiert
  -- keine Aenderung an Keyframes/Winkeln/Bewegung, der bereits
  durchgefuehrte dry-run bleibt inhaltlich gueltig.
  AP8 (11/14): kein Aufruf dieser Geste ueber einen Behavior-Tree-Knoten
  oder eine sonstige nutzergerichtete Stelle im Repository gefunden --
  deshalb system_only=true/selectable_by_llm=false, bis ein belastbarer
  Einsatzpfad nachgewiesen wird.
max_duration_s: 3.1
on_cancel: hold
keyframes:
  - time_from_start_s: 1.5
    joints:
      HeadYaw: 0.0
      HeadPitch: 0.0
      LShoulderPitch: 0.0
      RShoulderPitch: 0.0
      LShoulderRoll: 0.15
      RShoulderRoll: -0.15
      LElbowYaw: 0.0
      RElbowYaw: 0.0
      LElbowRoll: -0.02
      RElbowRoll: 0.02
      HipRoll: 0.0
      HipPitch: 0.0
      KneePitch: 0.0
