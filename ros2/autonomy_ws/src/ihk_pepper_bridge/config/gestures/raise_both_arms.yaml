schema_version: 2
name: raise_both_arms
description: >
  Beide Arme langsam anheben. ShoulderPitch-Zielwinkel (-1.0) identisch
  zum bereits live getesteten wave_right/wave_left-Vorbereitungswinkel
  (siehe docs/STATUS.md), hier symmetrisch auf beide Arme angewandt --
  eine Uebertragung eines bewiesenen Einzelwerts, nicht neu erfunden.
requires_stationary: true
allowed_interaction_states: [IDLE, ATTRACT, CONVERSATION_READY]
speed_scale_default: 0.6
restore_after: true
tested_status: dry_run_validated
tested_date: "2026-09-03"
test_note: >
  ShoulderPitch-Zielwinkel von der live getesteten wave_*-Sequenz
  uebernommen. Die bilaterale Gleichzeitigkeit und der v2-Transport
  selbst sind NICHT live geprueft (kein Pepper-Zugriff diese Session).
max_duration_s: 3.0
on_cancel: restore
keyframes:
  - time_from_start_s: 2.0
    joints: {LShoulderPitch: -1.0, RShoulderPitch: -1.0}
