schema_version: 2
name: raise_both_arms
description: >
  Beide Arme langsam anheben -- eine begeisterte, feiernde Geste.
system_only: false
selectable_by_llm: true
semantic_tags: [celebration, arms_raised, enthusiasm]
requires_stationary: true
allowed_interaction_states: [IDLE, ATTRACT, CONVERSATION_READY]
speed_scale_default: 0.6
restore_after: true
tested_status: dry_run_validated
tested_date: "2026-09-03"
test_note: >
  ShoulderPitch-Zielwinkel (-1.0) identisch zum bereits live getesteten
  wave_right/wave_left-Vorbereitungswinkel (siehe docs/STATUS.md), hier
  symmetrisch auf beide Arme angewandt -- eine Uebertragung eines
  bewiesenen Einzelwerts, nicht neu erfunden. Die bilaterale
  Gleichzeitigkeit und der v2-Transport selbst sind NICHT live geprueft
  (kein Pepper-Zugriff diese Session).
  AP8.4-Korrektur (Entwicklungsauftrag 04-B): max_duration_s bezog sich
  bislang auf die unskalierte time_from_start_s-Achse. Der Compiler
  prueft seit AP8.4 die tatsaechlich AUSGEFUEHRTE Dauer nach
  speed_scale_default-Skalierung (2.0s / 0.6 = 3.33s). max_duration_s
  wurde entsprechend auf den real ausgefuehrten Wert (+Marge) korrigiert
  -- keine Aenderung an Keyframes/Winkeln/Bewegung, der bereits
  durchgefuehrte dry-run bleibt inhaltlich gueltig.
max_duration_s: 3.4
on_cancel: restore
keyframes:
  - time_from_start_s: 2.0
    joints: {LShoulderPitch: -1.0, RShoulderPitch: -1.0}
