schema_version: 2
name: nod_once
description: >
  Einmaliges Kopfnicken (Kopf leicht senken und wieder heben).
  requires_stationary=true -- Kopfgesten sind waehrend Mapping/Navigation
  grundsaetzlich gesperrt (siehe docs/ARCHITECTURE_REALSense_BT.md,
  GestureCatalog.play(mapping_active=...)).
requires_stationary: true
allowed_interaction_states: [CONVERSATION_READY, SPEAKING, ATTRACT]
speed_scale_default: 0.8
restore_after: true
tested_status: draft
tested_date: null
test_note: >
  Keine Live-Referenz fuer Kopfgesten in dieser Session vorhanden --
  konservative Winkel innerhalb der dokumentierten (NICHT live
  verifizierten) HeadPitch-Grenzen aus joint_limits.py.
max_duration_s: 1.5
on_cancel: restore
keyframes:
  - time_from_start_s: 0.5
    joints: {HeadPitch: 0.3}
  - time_from_start_s: 1.0
    joints: {HeadPitch: 0.0}
