schema_version: 2
name: explain_left
description: >
  Erklaer-Geste mit Verweis auf Peppers linke Seite -- der linke Arm
  oeffnet sich moderat zur Seite.
system_only: false
selectable_by_llm: true
semantic_tags: [explanation, gesture_left, reference_pointing]
requires_stationary: true
allowed_interaction_states: [CONVERSATION_READY]
speed_scale_default: 0.7
restore_after: true
tested_status: draft
tested_date: null
test_note: >
  Neue, einseitige Bewegung ohne direkte Live-Referenz -- Winkel
  zwischen open_arms.yaml (ShoulderRoll 0.9, dry_run_validated) und
  greet_open.yaml (ShoulderRoll 0.5, draft) interpoliert. Konservativer
  ShoulderRoll-Zielwinkel (0.6), ElbowRoll bleibt nahe Neutralstellung
  (kein Anwinkeln Richtung Koerper/Gesicht).
max_duration_s: 2.0
on_cancel: restore
keyframes:
  - time_from_start_s: 0.7
    joints: {LShoulderPitch: 0.0, LShoulderRoll: 0.6, LElbowRoll: -0.1}
  - time_from_start_s: 1.4
    joints: {LShoulderPitch: 0.15, LShoulderRoll: 0.3, LElbowRoll: -0.05}
