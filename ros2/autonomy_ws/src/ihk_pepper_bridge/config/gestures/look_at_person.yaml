schema_version: 2
name: look_at_person
description: >
  PLATZHALTER: Kopf in eine feste, neutrale, nach vorne gerichtete
  Position bringen. Berechnet KEINE echte Blickrichtung zu einer
  konkreten Person, verwendet keine Personenposition und kein
  TF-Ziel -- ersetzt NICHT SetHeadPose oder eine TF-basierte
  Zielausrichtung. Reines Systemsignal, nicht vom LLM auswaehlbar.
system_only: true
selectable_by_llm: false
semantic_tags: []
requires_stationary: true
allowed_interaction_states: [IDLE, ATTRACT, CONVERSATION_READY]
speed_scale_default: 0.8
restore_after: false
tested_status: draft
tested_date: null
test_note: >
  Reine Neutralstellung (HeadYaw=0, HeadPitch=0) -- braucht keine
  Live-Referenz, ist aber noch KEINE echte Personen-Blickrichtung. Eine
  echte dynamische Ausrichtung braeuchte die Bildposition/den Winkel
  der Person relativ zu Pepper aus ihk_pepper_perception -- folgt erst
  in einem spaeteren Auftrag, sobald eine echte 3D-Personenposition
  zuverlaessig vorliegt.
max_duration_s: 1.5
on_cancel: hold
keyframes:
  - time_from_start_s: 0.8
    joints: {HeadYaw: 0.0, HeadPitch: 0.0}
