schema_version: 2
name: point_to_self
description: >
  Symbolischer Verweis auf sich selbst -- linker Arm bewegt sich Richtung
  eigene Brust. KEIN echtes Zeigen mit dem Finger (Pepper hat nur 1
  Motor pro Hand, auf/zu -- siehe docs/CAPABILITIES.md).
system_only: false
selectable_by_llm: true
semantic_tags: [self_reference, symbolic_gesture]
requires_stationary: true
allowed_interaction_states: [CONVERSATION_READY]
speed_scale_default: 0.5
restore_after: true
tested_status: draft
tested_date: null
test_note: >
  Keine Live-Referenz vorhanden. Winkel aus thinking_symbolic.yaml
  (Ellbogenbeugung Richtung Torso, Schulter bleibt tief -- "keine Haende
  im Gesichtsbereich" strikt eingehalten) und self_hug_symbolic.yaml
  (Ellbogen-Rotation Richtung Koerpermitte) abgeleitet, nicht neu
  erfunden. Linker statt rechter Arm gewaehlt (keine funktionale
  Notwendigkeit, aber Symmetrie zu bestehenden rechtsseitigen
  Referenzgesten). Vor jedem dry-run: mit `gesturectl preview
  point_to_self` (RViz) visuell pruefen, dass die Hand tatsaechlich in
  Richtung eigener Brust und NICHT in Richtung Gesicht/Kopf zeigt.
  AP8.4-Migration (Entwicklungsauftrag 04-B, bestaetigter Fund 3.4): der
  urspruengliche erste Keyframe (t=0.0, HeadPitch=-0.05) wich von der
  angenommenen NEUTRAL_STAND_POSE-Startpose (HeadPitch=0.0) ab, was der
  neue Uebergangs-/Geschwindigkeitscheck aus AP8.4 korrekt als Sprung
  ablehnt. Migration OHNE Bedeutungsaenderung: neuer Haltepunkt bei
  t=0.0 (HeadPitch=0.0) eingefuegt, urspruenglicher erster Keyframe auf
  t=0.2s verschoben (Minimum 0.017s, Marge). Alle weiteren Keyframe-
  Zeiten unveraendert -- Gesamtdauer/Choreografie identisch.
  Zusaetzlich AP8.4-Korrektur: max_duration_s war bereits VOR dieser
  Migration bezogen auf die unskalierte Zeitachse zu niedrig angesetzt
  (1.3s / 0.5 = 2.6s effektive Ausfuehrungsdauer > 2.5s) -- dieser
  vorbestehende Fehler war bislang durch den fruehen Geschwindigkeits-
  Abbruch maskiert und wird hier erstmals sichtbar. Wert entsprechend
  auf die real ausgefuehrte Dauer (+Marge) korrigiert.
max_duration_s: 2.7
on_cancel: restore
keyframes:
  - time_from_start_s: 0.0
    joints: {HeadPitch: 0.0}
  - time_from_start_s: 0.2
    joints: {HeadPitch: -0.05}
  - time_from_start_s: 1.3
    joints: {LShoulderPitch: 0.6, LShoulderRoll: 0.2, LElbowRoll: -0.7, LElbowYaw: -0.3}
