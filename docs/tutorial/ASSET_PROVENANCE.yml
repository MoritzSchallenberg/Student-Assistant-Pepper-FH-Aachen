# Bild-Herkunftsnachweis fuer das Pepper Developer Tutorial.
#
# Regeln (Arbeitspaket 15, Abschnitt 15.7):
# - Standardstatus ist candidate.
# - Nur approved darf im veroeffentlichten Tutorial erscheinen.
# - Unbekannte Herkunft fuehrt zu recreate oder rejected.
# - Bilder mit erkennbaren Personen brauchen eine geklaerte
#   Veroeffentlichungserlaubnis.
# - Interne Benutzernamen, Pfade, IP-Adressen, Geraeteinformationen
#   muessen entfernt werden.
# - Spot- und Kinova-Bilder muessen eindeutig als Fremdplattform
#   gekennzeichnet sein.
# - Ein Kinova-Arm darf nicht zur Erklaerung von Peppers Gelenkgrenzen
#   verwendet werden.
#
# Zulaessige decision-Werte: candidate | approved | recreate | rejected

