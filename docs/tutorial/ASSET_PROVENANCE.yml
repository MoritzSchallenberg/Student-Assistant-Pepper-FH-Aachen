  - id: arm_joints
    source_archive: "Robotik Tutorial.2.zip (Trash)"
    source_path: "00-02 Quelle 2 Spot Tutorial/Website Code/Tutorials/06 P4 YOLO and Moveit/.../arm_joints.png"
    title: "MoveIt-Gelenksteuerung, RViz-Screenshot"
    creator: unknown
    rights_holder: unknown
    license: unknown
    permission_reference: null
    contains_people: false
    contains_internal_information: true  # Fenstertitel zeigt einen lokalen Dateipfad mit einem echten Benutzernamen
    platform: spot   # zeigt einen Kinova-Arm, montiert auf Boston Dynamics Spot -- NICHT Pepper
    intended_use: "geprueft fuer gestures-kinematics/gesture-format.md, NICHT verwendet"
    decision: recreate
    attribution: null
    note: >
      Zeigt Joint-Namen (shoulder_pan, wrist_1_joint, ...) eines
      Kinova-Arms auf Spot -- strukturell inkompatibel mit Peppers
      eigenen Gelenknamen (LShoulderPitch, RElbowRoll, ...). Ein
      Kinova-Arm darf nicht zur Erklaerung von Peppers Gelenkgrenzen
      verwendet werden (Arbeitspaket 15, Abschnitt 15.7). Eine
      Pepper-eigene Aufnahme muesste neu erstellt werden, sobald ein
      Pepper mit laufendem RViz verfuegbar ist.

