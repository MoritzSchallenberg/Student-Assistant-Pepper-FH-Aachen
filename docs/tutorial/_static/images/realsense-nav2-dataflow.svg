<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="sans-serif">
  <style>
    .box { fill: #e9f0f6; stroke: #2b6f8f; stroke-width: 2; rx: 8; }
    .safety { fill: #fbeaea; stroke: #8a1f2a; stroke-width: 2; rx: 8; }
    .lbl { font-size: 13px; fill: #1a1a1a; }
    .small { font-size: 10.5px; fill: #444; }
    .arrow { stroke: #555; stroke-width: 2; fill: none; marker-end: url(#arr4); }
  </style>
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="bold">RealSense-only Navigationspfad (Entwicklungsauftrag 2)</text>

  <rect class="box" x="330" y="50" width="240" height="46"/>
  <text class="lbl" x="450" y="78" text-anchor="middle">RealSense</text>

  <rect class="box" x="330" y="120" width="240" height="46"/>
  <text class="lbl" x="450" y="148" text-anchor="middle">statische Kopf-/Kamera-TF</text>

  <rect class="box" x="330" y="190" width="240" height="46"/>
  <text class="lbl" x="450" y="218" text-anchor="middle">RTAB-Map Odometrie/SLAM/Lokalisierung</text>

  <rect class="box" x="330" y="260" width="240" height="46"/>
  <text class="lbl" x="450" y="288" text-anchor="middle">Nav2 (Controller/Planner/BT-Nav.)</text>

  <rect class="box" x="330" y="330" width="240" height="40"/>
  <text class="lbl" x="450" y="355" text-anchor="middle" font-size="12">cmd_vel_raw -&gt; Velocity Smoother</text>

  <rect class="box" x="330" y="390" width="240" height="40"/>
  <text class="lbl" x="450" y="415" text-anchor="middle" font-size="12">cmd_vel_smoothed_raw -&gt; Collision Monitor</text>

  <rect class="safety" x="330" y="450" width="240" height="46"/>
  <text class="lbl" x="450" y="478" text-anchor="middle">Motion Guard</text>

  <rect class="safety" x="330" y="520" width="240" height="46"/>
  <text class="lbl" x="450" y="548" text-anchor="middle">/cmd_vel -&gt; naoqi_driver2 -&gt; Pepper</text>

  <path class="arrow" d="M450,96 L450,120"/>
  <path class="arrow" d="M450,166 L450,190"/>
  <path class="arrow" d="M450,236 L450,260"/>
  <path class="arrow" d="M450,306 L450,330"/>
  <path class="arrow" d="M450,370 L450,390"/>
  <path class="arrow" d="M450,430 L450,450"/>
  <path class="arrow" d="M450,496 L450,520"/>

  <!-- explicitly-excluded box -->
  <rect x="630" y="190" width="220" height="90" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" rx="6"/>
  <text class="small" x="740" y="210" text-anchor="middle" font-weight="bold">Bewusst NICHT im Bild:</text>
  <text class="small" x="740" y="228" text-anchor="middle">amcl, map_server,</text>
  <text class="small" x="740" y="244" text-anchor="middle">robot_localization/EKF mit</text>
  <text class="small" x="740" y="260" text-anchor="middle">Peppers eigener Odometrie/IMU --</text>
  <text class="small" x="740" y="276" text-anchor="middle">seit Auftrag 2 entfernt.</text>

  <rect x="30" y="450" width="220" height="90" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="6"/>
  <text class="small" x="140" y="470" text-anchor="middle" font-weight="bold">Unabhaengige Backups:</text>
  <text class="small" x="140" y="488" text-anchor="middle">Collision-Monitor BumperStop,</text>
  <text class="small" x="140" y="504" text-anchor="middle">Peppers eigener Laser</text>
  <text class="small" x="140" y="520" text-anchor="middle">(nicht Teil der Nav2-Costmap)</text>

  <text x="450" y="590" text-anchor="middle" class="small">
    enable_live_motion=false als Standard -- Motion Guard laesst ohne explizite Freigabe nie etwas durch, unabhaengig von allen anderen Bedingungen.
  </text>
</svg>
